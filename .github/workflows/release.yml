name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Package universal application
        run: ARCH=universal ./scripts/package.sh
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip dist/*.dmg dist/*SHA256SUMS.txt
          --draft --title "OpenInsert $GITHUB_REF_NAME"
          --notes-file docs/RELEASE_NOTES.md
